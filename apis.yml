aid: aaru
name: Aaru
description: 'Aaru is an AI synthetic-research and prediction company based in New York City, founded in
  2024 by Cam Fink, Ned Koh, and John Kessler. Aaru builds multi-agent simulation software that generates
  thousands of AI agents from public and proprietary behavioral data to model how individuals, groups,
  and entire populations will respond to future events, products, policies, and messaging. Its platform
  (marketed as Lumen) replaces traditional survey-based market research and polling with measurable-outcome
  simulation, covering price-sensitivity analysis, voter-behavior prediction, and disaster-communication
  testing. Customers include Accenture, EY, Interpublic Group, and political campaigns; the company raised
  a Series A at a roughly $1B headline valuation in December 2025, with backing from General Catalyst,
  Redpoint Ventures, Felicis, Abstract Ventures, and others. Aaru currently exposes no public developer
  API; this profile tracks its identity and web surface in the API Evangelist network.'
