# Aaru integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in aaru-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: aaru-cloud-security-alliance-star-registry
  label: Cloud Security Alliance STAR Registry
  partner_name: Cloud Security Alliance STAR Registry
  category: Cloud security assurance
  type: register
  channel: standard-directory
  evidence: https://cloudsecurityalliance.org/star/registry/aaru-inc/services/aaru
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CSA STAR Registry (cloudsecurityalliance.org/star/registry)
    spec_file: null
    standard: CSA STAR
    role: star-level-1
    registered_name: Aaru, Inc
    registry_id: aaru-inc
    service_url: https://aaru.com
    matched_domain: aaru.com
    matched_by: domain
    identity_source: the service URL the organisation filed on its STAR listing (no lookup)
    levels:
    - STAR Level 1
    certified_products: []
    signal_note: STAR Level 1 (CAIQ self-assessment) = participation; certified_products = one entry per STAR Level
      2 / STAR for AI Level 2 assessment TYPE (third-party certification, attestation, C-STAR, ValidAIted); lapsed
      = every instance marked (Deprecated) by the registry; service counts never recorded
    detected_by: sweep-compliance-assurance.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
- slug: aaru-insights-association
  label: Insights Association
  partner_name: Insights Association
  category: market research trade association membership
  type: register
  channel: standard-directory
  evidence: https://www.insightsassociation.org/Membership/Our-Members
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Insights Association member organisations (insightsassociation.org/Membership/Our-Members, organizationdll.dll/List)
    standard: Insights Association Code of Standards
    spec_file: null
    role: insights-association-member
    registered_name: Aaru
    partner_tier: Agency/Supplier
    register_location: NY, NY
    matched_domain: aaru.com
    matched_by: domain
    signal_note: 'participation: member organisation bound by the IA Code of Standards; CIRQ certifications -> certified_products
      (one per certification type); GDQ Pledge / Privacy Framework are context, never counted'
    detected_by: sweep-surveys-research.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
